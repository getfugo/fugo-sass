[workspace]
members = [
    "crates/compiler",
    "crates/include_sass",
    "crates/lib",
    "crates/spec",
]

[profile.release]
debug = 1
panic = "abort"
lto = true
codegen-units = 1

[profile.small]
inherits = 'release'
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true


# The sass-spec runner (crates/spec, `cargo spec`): optimized, but panics unwind, so that a
# panicking spec is one failure rather than the end of the run.
[profile.spec]
inherits = "release"
panic = "unwind"
lto = false
codegen-units = 16
