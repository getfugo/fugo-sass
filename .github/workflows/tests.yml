name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  # The toolchain CI builds, tests and lints with: the latest stable Rust.
  RUST_TOOLCHAIN: "1.99.0"
  # The minimum supported Rust version, `rust-version` in the crates' Cargo.toml (fugo's).
  RUST_MSRV: "1.96.0"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: version info
        run: rustc --version; cargo --version;

      - name: Run all tests
        run: cargo test --workspace --features=macro

  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - run: cargo fmt --all -- --check

  # No file of code may be longer than 500 lines (AGENTS.md).
  file-length:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - run: |
          long=$(git ls-files '*.rs' '*.sh' | xargs wc -l | awk '$2 != "total" && $1 > 500')
          if [ -n "$long" ]; then
            echo "Files longer than 500 lines (see AGENTS.md):"
            echo "$long"
            exit 1
          fi

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - run: cargo clippy --workspace --all-targets --features=macro,wasm-exports -- -D warnings

  # Every crate builds on its own with the minimum supported Rust version.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_MSRV }}

      - run: |
          cargo check --workspace --all-targets --features=macro,wasm-exports
          cargo check -p fugo-sass-compiler --no-default-features
          cargo check -p fugo-sass-macro
          cargo check -p fugo-sass --no-default-features

  wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - run: cargo check -p fugo-sass --target wasm32-unknown-unknown --no-default-features --features=random,wasm-exports

  sass-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Run sass-spec (crates/spec)
        run: cargo spec --baseline crates/spec/failures.txt

  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Build
        run: cargo build

      - name: Install dart-sass 1.105.1
        run: |
          wget -q https://github.com/sass/dart-sass/releases/download/1.105.1/dart-sass-1.105.1-linux-x64.tar.gz
          tar -xzf dart-sass-1.105.1-linux-x64.tar.gz

      # The differences between dart-sass's and fugo-sass's CSS for Bootstrap must be exactly those
      # of crates/spec/bootstrap/<version>.diff (crates/spec/README.md).
      - name: Compare Bootstrap's CSS with dart-sass's
        run: |
          status=0
          mkdir -p out
          for version in 5.0.2 5.3.3; do
            git clone -q --depth=1 --branch "v$version" https://github.com/twbs/bootstrap.git "bootstrap-$version"
            crates/spec/bootstrap.sh "$PWD/dart-sass/sass" "$PWD/target/debug/fugo-sass" \
              "$PWD/bootstrap-$version" "$PWD/out/$version" > "out/$version.diff"
            if ! cmp -s "out/$version.diff" "crates/spec/bootstrap/$version.diff"; then
              echo "Bootstrap $version: the differences from dart-sass changed:"
              git diff --no-index --no-color "crates/spec/bootstrap/$version.diff" "out/$version.diff" || true
              status=1
            fi
          done
          exit $status
