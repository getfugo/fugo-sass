name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.70.0"

      - name: version info
        run: rustc --version; cargo --version;

      - name: Run all tests
        run: cargo test --features=macro

  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.70.0"

      - run: |
          rustup component add rustfmt
          cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.70.0"

      - run: |
          rustup component add clippy
          cargo clippy --features=macro -- -D warnings

  sass-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.70.0"

      - name: Run sass-spec (crates/spec)
        run: cargo spec --baseline crates/spec/failures.txt

  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Build
        run: cargo build

      - name: Install dart-sass 1.54.3
        run: |
          wget https://github.com/sass/dart-sass/releases/download/1.54.3/dart-sass-1.54.3-linux-x64.tar.gz
          tar -xzvf dart-sass-1.54.3-linux-x64.tar.gz

      - name: Install bootstrap
        run: git clone --depth=1 --branch v5.0.2 https://github.com/twbs/bootstrap.git

      - name: Verify unchanged output
        run: |
          ./target/debug/fugo-sass bootstrap/scss/bootstrap.scss > fugo-sass-output.css
          ./dart-sass/sass bootstrap/scss/bootstrap.scss > dart-sass-output.css

          if [[ $(diff -u fugo-sass-output.css dart-sass-output.css) ]]; then
              echo "Differences found"
              diff -u fugo-sass-output.css dart-sass-output.css
              exit 1
          else
              echo "No differences found"
          fi
