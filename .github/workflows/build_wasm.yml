name: 'Build WebAssembly'

on:
  push:
    tags: [ '*' ]
      
  workflow_dispatch:

env:
  # The toolchain the crates need (`rust-version` in Cargo.toml's `[workspace.package]`), as in
  # tests.yml: the runner's preinstalled Rust can be older.
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 'Checkout Repository'
      uses: actions/checkout@v7

    - name: 'Install Rust'
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        targets: wasm32-unknown-unknown

    - name: 'Install wasm-pack'
      run: |
        curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
        export PATH="$HOME/.cargo/bin:$PATH"
    
    - name: 'Build WebAssembly'
      run: |
        pushd ./crates/lib
        # `wasm-exports` exports `from_string` to JavaScript: without it the module exports nothing.
        wasm-pack build --release --target web --out-name index -- \
          --no-default-features --features=random,wasm-exports
        popd
        mkdir -p artifacts
        find crates/lib/pkg -type f \( -name "*.js" -o -name "*.d.ts" -o -name "*.wasm" \) -exec cp {} artifacts \;
        
    - name: 'Upload Artifacts'
      uses: actions/upload-artifact@v7
      with:
        name: 'wasm'
        path: artifacts/*
